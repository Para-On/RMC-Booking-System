name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmc_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        run: ./mvnw test -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmc_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rmc_frontend/package-lock.json
      - name: Install and build frontend
        run: |
          npm ci
          npm run build
