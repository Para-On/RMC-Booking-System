spring.datasource.url=jdbc:h2:mem:rmc_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

jwt.signing-secret=test-jwt-signing-secret-at-least-32-chars
jwt.access-token-minutes=15
jwt.refresh-token-days=7
jwt.lockout-threshold=5
jwt.lockout-minutes=15

maya.public-key=
maya.secret-key=
maya.api-base-url=https://pg-sandbox.paymaya.com
maya.frontend-base-url=http://localhost:5173

app.scheduler.interval-ms=3600000
app.mail.enabled=false
app.rate-limit.guest-bookings-per-minute=0

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
