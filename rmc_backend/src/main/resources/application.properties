spring.application.name=rmc

# Optional local overrides: .env in project root or application-local.properties on classpath
spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties

# MySQL — override via DB_* environment variables or .env file
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:rmc_booking_system}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis is on the classpath but not used yet — enable when you add caching/sessions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
