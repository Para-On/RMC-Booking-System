spring.application.name=rmc

server.port=${SERVER_PORT:8082}

spring.config.import=optional:file:.env[.properties],optional:classpath:application-local.properties

# MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:rmc_booking_system}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (manual bean — runs before JPA validate)
spring.flyway.enabled=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}

# Redis disabled until needed
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# OpenAPI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger

# JWT (override JWT_SIGNING_SECRET in production)
jwt.signing-secret=${JWT_SIGNING_SECRET:dev-only-change-me-use-at-least-32-characters-long}
jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}
jwt.lockout-threshold=${JWT_LOCKOUT_THRESHOLD:5}
jwt.lockout-minutes=${JWT_LOCKOUT_MINUTES:15}

# Maya Checkout (sandbox defaults)
maya.public-key=${MAYA_PUBLIC_KEY:}
maya.secret-key=${MAYA_SECRET_KEY:}
maya.api-base-url=${MAYA_API_BASE_URL:https://pg-sandbox.paymaya.com}
maya.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Schedulers
app.scheduler.interval-ms=${SCHEDULER_INTERVAL_MS:60000}

# Email (disabled by default — set MAIL_ENABLED=true and SMTP settings to send)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:bookings@rmc.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

# Guest booking rate limit (requests per IP per minute; 0 = disabled)
app.rate-limit.guest-bookings-per-minute=${GUEST_BOOKING_RATE_LIMIT:10}
